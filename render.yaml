# Render blueprint for the API and the nightly release check (design doc §3, Feature 15).
services:
  - type: web
    name: solarax-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
  - type: cron
    name: solarax-release-check
    runtime: python
    rootDir: api
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.check_releases
