services:
  - type: web
    name: thelegend35-sky-viewer-api
    runtime: python
    plan: free
    rootDir: Sky-Viewer
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.lookup:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_IMAGES
        value: "24"
      - key: LOOKUP_WORKERS
        value: "4"
