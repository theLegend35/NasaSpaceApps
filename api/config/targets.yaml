# Test targets from the brief. Rule: no number goes in here unless we fetched or
# measured it. Values below are quoted from the team design doc with its source.
# Anything not listed is resolved live from SIMBAD by GET /targets and cached.
# Science + story owns this file (first deliverable: "targets.yaml checked").

targets:
  - id: wise0855
    name: WISE 0855
    simbad: "WISE J085510.83-071442.5"
    aliases: ["wise 0855", "wise0855", "wise 0855-0714", "wise j0855"]
    kind: Cold brown dwarf
    expected_class: brown_dwarf
    fast_mover: true          # deep time on by default
    # Design doc §2/§Feature 1: SIMBAD J2000 position and AllWISE 2010 position.
    simbad_j2000: { ra: 133.81891, dec: -7.24705, source: "SIMBAD via design doc" }
    allwise: { ra: 133.79476, dec: -7.24515, epoch: 2010.5, w1: 16.231, w2: 13.704,
               designation: "J085510.74-071442.5", coadd_id: "1342m076_ac51",
               source: "AllWISE allwise_p3as_psd / Atlas via design doc" }
    pm_mas_yr: { ra: -8123.7, dec: 673.2, source: "design doc Feature 3" }
    detector: D6              # to verify by eye on Saturday (faint below 2 um)

  - id: barnard
    name: "Barnard's Star"
    simbad: "Barnard's Star"
    aliases: ["barnard", "barnards star", "barnard's star", "gj 699"]
    kind: Fast-moving nearby star
    expected_class: high_motion_star
    fast_mover: true
    saturated: true           # core is flagged; use the Gaia position
    detector: D1

  - id: epsindib
    name: Epsilon Indi B
    simbad: "eps Ind B"
    aliases: ["epsilon indi b", "eps ind b", "eps indi b"]
    kind: Brown dwarf pair (one source at 6.15 arcsec pixels)
    expected_class: brown_dwarf
    fast_mover: true
    detector: D5

  - id: rwaur
    name: RW Aurigae
    simbad: "RW Aur"
    aliases: ["rw aurigae", "rw aur"]
    kind: Young variable star
    expected_class: variable_star
    detector: D1

  - id: rdra
    name: R Draconis
    simbad: "R Dra"
    aliases: ["r draconis", "r dra"]
    kind: Mira variable
    expected_class: variable_star
    detector: D1

  - id: eros
    name: Eros
    horizons_id: "433"
    aliases: ["eros", "433 eros", "433"]
    kind: Near-Earth asteroid
    expected_class: asteroid
    solar_system: true
    # Design doc: moved ~213 arcsec in 1.53 h on 2026-02-13; MOST found 280 image hits
    # (53 in D1) between 2026-02-01 and 2026-03-05.
    same_field_pair_date: "2026-02-13"
    detector: D1
