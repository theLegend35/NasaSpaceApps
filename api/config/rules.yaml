# Transparent class scoring (design doc Feature 8).
# score(class) = sum(weight_i * v_i), v_i = ramp(x_i, a, b) in [0, 1]; weights total 100.
# ramp(x, a, b): 0 at a, 1 at b, linear between, clamped. a > b is allowed (falling ramp).
#
# EVERY weight and threshold here is a PROPOSAL. Change one only with a written
# reason in the commit message. Never tune to force a test target.

thresholds:              # PROPOSAL
  likely: 70
  possible: 40
  uncertain_margin: 10   # top two within 10 points -> uncertain
  artifact_wins: 60
  motion_significance_min: 5

classes:
  brown_dwarf:           # weights from the design doc table (PROPOSAL)
    label: Brown dwarf
    inputs:
      - { name: motion,       weight: 30, feature: pm_arcsec_yr, ramp: [0.1, 1.0], requires_significance: true,
          explain: "Moves {pm_arcsec_yr:.2f}″/yr" }
      - { name: methane_dip,  weight: 25, feature: ch4_index, ramp: [0.9, 0.5], explain: "methane index {ch4_index:.2f}" }
      - { name: water_dips,   weight: 20, feature: water_index_mean, ramp: [0.95, 0.6], explain: "water index {water_index_mean:.2f}" }
      - { name: red_in_wise,  weight: 15, feature: w1_w2, ramp: [0.4, 2.0], explain: "W1−W2 {w1_w2:.2f}" }
      - { name: gaia_dark,    weight: 10, feature: gaia_dark_value, ramp: [0.0, 1.0], explain: "Gaia: {gaia_text}" }

  high_motion_star:      # PROPOSAL: moves, seen by Gaia, no methane
    label: High-motion star
    inputs:
      - { name: motion,       weight: 45, feature: pm_arcsec_yr, ramp: [0.1, 1.0], requires_significance: true,
          explain: "Moves {pm_arcsec_yr:.2f}″/yr" }
      - { name: gaia_seen,    weight: 35, feature: gaia_seen_value, ramp: [0.0, 1.0], explain: "Gaia: {gaia_text}" }
      - { name: no_methane,   weight: 20, feature: ch4_index, ramp: [0.7, 0.95], explain: "methane index {ch4_index:.2f}" }

  variable_star:         # PROPOSAL: brightness changes at the same wavelength, little motion
    label: Variable star
    inputs:
      - { name: variability,  weight: 60, feature: variability_sigma, ramp: [3.0, 10.0], explain: "brightness change {variability_sigma:.1f}σ" }
      - { name: static,       weight: 25, feature: pm_arcsec_yr, ramp: [0.5, 0.05], explain: "motion {pm_arcsec_yr:.2f}″/yr" }
      - { name: gaia_seen,    weight: 15, feature: gaia_seen_value, ramp: [0.0, 1.0], explain: "Gaia: {gaia_text}" }

  asteroid:              # PROPOSAL: decided by the Horizons/MOST gate first
    label: Asteroid
    inputs:
      - { name: known_ss,     weight: 70, feature: known_ss_value, ramp: [0.0, 1.0], explain: "solar-system match: {known_ss_text}" }
      - { name: same_day,     weight: 30, feature: same_day_rate_arcsec_hr, ramp: [1.0, 30.0], explain: "same-day motion {same_day_rate_arcsec_hr:.1f}″/h" }

  artifact:              # PROPOSAL
    label: Image artifact
    inputs:
      - { name: flagged,      weight: 60, feature: flagged_fraction, ramp: [0.2, 0.6], explain: "{flagged_pct:.0f}% of its pixels flagged" }
      - { name: too_sharp,    weight: 25, feature: extent_ratio, ramp: [0.8, 0.4], explain: "extent {extent_ratio:.2f}× the PSF" }
      - { name: one_exposure, weight: 15, feature: single_exposure_value, ramp: [0.0, 1.0], explain: "seen in one exposure only" }

  static_star:           # PROPOSAL: the boring default
    label: Ordinary star
    inputs:
      - { name: gaia_seen,    weight: 50, feature: gaia_seen_value, ramp: [0.0, 1.0], explain: "Gaia: {gaia_text}" }
      - { name: static,       weight: 50, feature: pm_arcsec_yr, ramp: [0.3, 0.02], explain: "motion {pm_arcsec_yr:.2f}″/yr" }

# Spectral index windows (micrometres). Methane is from the design doc.
# Water and CO2 windows are PROPOSALS for Science to check.
indices:
  ch4_index:   { num: [3.25, 3.40], den: [3.85, 4.05] }   # design doc
  water_1p4:   { num: [1.35, 1.45], den: [1.20, 1.30] }   # PROPOSAL
  water_1p9:   { num: [1.85, 1.95], den: [1.65, 1.75] }   # PROPOSAL
  co2_index:   { num: [4.20, 4.35], den: [3.85, 4.05] }   # PROPOSAL

clean:                   # Feature 6 rules, all PROPOSAL
  flagged_fraction_reject: 0.5
  too_sharp_ratio: 0.5
  edge_px: 3
  cnn_min_p_real: 0.2

flags:
  # Default hide set, by NAME (never by bit number). PROPOSAL: check each against MSKD text.
  hide: [TRANSIENT, SUR_ERROR, NONFUNC, MISSING_DATA, HOT, COLD, NONLINEAR, PERSIST,
         OUTLIER, GHOST, GHOST_FPA, GHOST_EXT, BLOOM, SNOWBALL, HALO]
  info_only: [SOURCE]
  ignore: [OVERFLOW]     # coincides with SUR_ERROR per the IRSA Source Discovery notebook
